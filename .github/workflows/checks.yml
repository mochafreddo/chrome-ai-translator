name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check commit format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
          elif ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          npm run check:commits -- "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run check:syntax
        if: ${{ !cancelled() }}
      - run: npm run check:docs
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}

  browser-fixtures:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global agent-browser@0.39.1
      - run: agent-browser install --with-deps
      - run: npm run test:integration:inline-button -- --fixture-only
      - run: npm run test:integration:heading-permalink -- --fixture-only
      - run: npm run test:integration:github-release-accounts -- --fixture-only
      - run: npm run test:integration:inline-inspection
